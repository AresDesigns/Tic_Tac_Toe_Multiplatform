directories:
  output: release
  buildResources: assets
appId: com.tictactoe.app
productName: Tic Tac Toe
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - assets/**/*
win:
  target: nsis
  icon: assets/icon.ico
mac:
  target: dmg
  icon: assets/icon.icns
linux:
  target: AppImage
  icon: assets/icon.png
electronVersion: 28.3.3
