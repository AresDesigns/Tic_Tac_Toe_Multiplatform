<svg width="400" height="200" id="gradient-animation">
  <title>Animated Dark Gradient</title>
  <defs>
    <linearGradient id="dark-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="5%" style="stop-color: #2A0944;stop-opacity: 1" />
      <stop offset="95%" style="stop-color: #1A0833;stop-opacity: 1" />
    </linearGradient>
    <filter id="blur-filter">
      <feGaussianBlur stdDeviation="2"></feGaussianBlur>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#dark-gradient)" filter="url(#blur-filter)"/>
</svg>

<style>
  #gradient-animation {
    animation: gradient-move 10s ease infinite;
  }

  @keyframes gradient-move {
    from {
      opacity: 1;
      transform: translateX(0);
    }
    to {
      opacity: 0.4;
      transform: translateX(400px);
    }
  }
</style>
